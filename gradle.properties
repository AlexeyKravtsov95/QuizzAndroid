org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# ITERATION_2_DESIGN.md, PR 2B (D-16): AGP 9.0+ по умолчанию создаёт unit-test-задачу
# только для "тестируемого" build type (по умолчанию debug) — BooleanOption
# ONLY_ENABLE_UNIT_TEST_BY_DEFAULT_FOR_THE_TESTED_BUILD_TYPE, стабильный флаг,
# включён по умолчанию с AGP 9.0. Без этой строки testReleaseUnitTest не существует
# как задача вовсе, и P17 (src/testRelease/.../SystemClockProviderTest.kt) не
# запускался бы никогда. Это интеграционная деталь тулчейна, а не архитектурное
# решение: она не меняет ни один из D-1..D-22.
android.onlyEnableUnitTestForTheTestedBuildType=false
