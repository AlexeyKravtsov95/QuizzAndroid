  <use href="#a-icon-chev-up" x="776" y="510" opacity="0.85"/>
  <rect x="764" y="558" width="48" height="48" rx="6" fill="#22262B" fill-opacity="0.06" stroke="#22262B" stroke-opacity="0.3"/>
  <use href="#a-icon-chev-down" x="776" y="570" opacity="0.85"/>
  <use href="#a-icon-grip" x="838" y="552"/>
  <line x1="514" y1="612" x2="856" y2="612" stroke="#22262B" stroke-opacity="0.14" stroke-width="1"/>

