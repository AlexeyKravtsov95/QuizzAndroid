<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" font-family="-apple-system,'Segoe UI',Roboto,'Noto Sans',Arial,sans-serif">
<title>Концепция A — Редакционный альманах</title>
<defs>
  <style>
    .serif{font-family:Georgia,'PT Serif','Noto Serif',serif}
    .sans{font-family:-apple-system,'Segoe UI',Roboto,'Noto Sans',Arial,sans-serif}
    .ink{fill:#22262B}
    .cream{fill:#F6F1E7}
    .accent{fill:#B5502F}
    .forest{fill:#3E5C50}
  </style>
  <clipPath id="a-home-clip"><rect x="60" y="150" width="390" height="844" rx="40"/></clipPath>
  <clipPath id="a-puzzle-clip"><rect x="490" y="150" width="390" height="844" rx="40"/></clipPath>
  <g id="a-icon-gear">
    <circle cx="12" cy="12" r="6" fill="none" stroke="#22262B" stroke-width="1.6"/>
    <circle cx="12" cy="12" r="1.4" fill="#22262B"/>
    <g stroke="#22262B" stroke-width="1.6" stroke-linecap="round">
      <line x1="18.5" y1="12" x2="21.5" y2="12"/>
      <line x1="15.25" y1="17.63" x2="16.75" y2="20.23"/>
      <line x1="8.75" y1="17.63" x2="7.25" y2="20.23"/>
      <line x1="5.5" y1="12" x2="2.5" y2="12"/>
      <line x1="8.75" y1="6.37" x2="7.25" y2="3.77"/>
      <line x1="15.25" y1="6.37" x2="16.75" y2="3.77"/>
    </g>
  </g>
  <g id="a-icon-archive">
