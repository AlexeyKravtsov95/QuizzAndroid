  <use href="#a-icon-gear" x="402" y="184"/>
  <use href="#a-icon-archive" x="370" y="184"/>
  <line x1="84" y1="210" x2="426" y2="210" stroke="#22262B" stroke-opacity="0.3" stroke-width="1"/>

  <text x="84" y="234" class="sans" font-size="14" fill="#22262B" opacity="0.7">Суббота, 29 августа 2026</text>

  <text x="84" y="270" class="sans" font-size="11" font-weight="700" letter-spacing="2" fill="#B5502F">ВЫПУСК</text>
  <text x="84" y="326" class="serif" fill="#22262B">
    <tspan font-size="28">День </tspan><tspan font-size="58" font-weight="700">1</tspan>
  </text>
  <line x1="84" y1="342" x2="220" y2="342" stroke="#B5502F" stroke-width="2"/>

  <!-- stats: editorial masthead rows -->
  <text x="84" y="406" class="sans" font-size="12" font-weight="700" letter-spacing="2" fill="#22262B" opacity="0.55">СЕРИЯ</text>
  <text x="84" y="432" class="sans" font-size="22" font-weight="600" fill="#22262B">6 дней</text>
  <line x1="84" y1="444" x2="426" y2="444" stroke="#22262B" stroke-opacity="0.14" stroke-width="1"/>

  <text x="84" y="474" class="sans" font-size="12" font-weight="700" letter-spacing="2" fill="#22262B" opacity="0.55">ЛУЧШИЙ ДЕНЬ</text>
  <text x="84" y="500" class="sans" font-size="22" font-weight="600" fill="#22262B">17 из 18</text>
  <line x1="84" y1="512" x2="426" y2="512" stroke="#22262B" stroke-opacity="0.14" stroke-width="1"/>

  <text x="84" y="542" class="sans" font-size="12" font-weight="700" letter-spacing="2" fill="#22262B" opacity="0.55">СЫГРАНО ДНЕЙ</text>
  <text x="84" y="568" class="sans" font-size="22" font-weight="600" fill="#22262B">23</text>
  <line x1="84" y1="580" x2="426" y2="580" stroke="#22262B" stroke-opacity="0.14" stroke-width="1"/>

  <!-- CTA -->
  <rect x="84" y="910" width="342" height="56" rx="8" fill="#22262B"/>
  <text x="255" y="944" class="sans" font-size="17" font-weight="600" text-anchor="middle" fill="#F6F1E7">Играть</text>
</g>

<!-- ============ PUZZLE PHONE ============ -->
<rect x="490" y="150" width="390" height="844" rx="40" fill="#F6F1E7" stroke="#22262B" stroke-opacity="0.25" stroke-width="1.5"/>
<g clip-path="url(#a-puzzle-clip)">
