  <use href="#a-icon-chev-up" x="776" y="646" opacity="0.85"/>
  <rect x="764" y="694" width="48" height="48" rx="6" fill="#22262B" fill-opacity="0.06" stroke="#22262B" stroke-opacity="0.3"/>
  <use href="#a-icon-chev-down" x="776" y="706" opacity="0.85"/>
  <use href="#a-icon-grip" x="838" y="688"/>
  <line x1="514" y1="748" x2="856" y2="748" stroke="#22262B" stroke-opacity="0.14" stroke-width="1"/>

  <!-- Card 4: Монблан -->
  <text x="527" y="834" class="serif" font-size="18" text-anchor="middle" fill="#22262B" opacity="0.4">4</text>
  <text x="550" y="810" class="serif" font-size="20" fill="#22262B">Монблан</text>
  <text x="550" y="834" class="sans" font-size="12" letter-spacing="1" fill="#22262B" opacity="0.55">АЛЬПЫ, ФРАНЦИЯ И ИТАЛИЯ</text>
  <rect x="764" y="770" width="48" height="48" rx="6" fill="#22262B" fill-opacity="0.06" stroke="#22262B" stroke-opacity="0.3"/>
  <use href="#a-icon-chev-up" x="776" y="782" opacity="0.85"/>
  <rect x="764" y="830" width="48" height="48" rx="6" fill="#22262B" fill-opacity="0" stroke="#22262B" stroke-opacity="0.18"/>
  <use href="#a-icon-chev-down" x="776" y="842" opacity="0.3"/>
  <use href="#a-icon-grip" x="838" y="824"/>
  <line x1="514" y1="884" x2="856" y2="884" stroke="#22262B" stroke-opacity="0.14" stroke-width="1"/>

