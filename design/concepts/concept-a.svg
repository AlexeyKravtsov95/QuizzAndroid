<rect x="0" y="0" width="1440" height="1120" fill="#FBF9F4"/>

<!-- Header -->
<text x="60" y="50" class="sans" font-size="16" font-weight="700" letter-spacing="2" fill="#8A6A55">КОНЦЕПЦИЯ A</text>
<text x="60" y="92" class="serif" font-size="34" font-style="italic" fill="#22262B">Редакционный альманах</text>
<text x="60" y="114" class="sans" font-size="13" fill="#22262B" opacity="0.55">«По порядку!» · Home (Ready) + Puzzle (Playing) · дизайн-борд, светлая тема + фрагмент тёмной</text>

<!-- Phone labels -->
<text x="255" y="142" class="sans" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle" fill="#8A6A55">HOME · READY</text>
<text x="685" y="142" class="sans" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle" fill="#8A6A55">PUZZLE · PLAYING</text>

<!-- ============ HOME PHONE ============ -->
<rect x="60" y="150" width="390" height="844" rx="40" fill="#F6F1E7" stroke="#22262B" stroke-opacity="0.25" stroke-width="1.5"/>
<g clip-path="url(#a-home-clip)">
  <!-- ghost folio watermark -->
