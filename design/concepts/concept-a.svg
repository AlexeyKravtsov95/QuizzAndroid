<!-- ============ RIGHT COLUMN: system notes ============ -->
<text x="940" y="164" class="sans" font-size="13" font-weight="700" letter-spacing="2" fill="#22262B" opacity="0.6">ПАЛИТРА</text>
<g font-family="-apple-system,'Segoe UI',Roboto,'Noto Sans',Arial,sans-serif">
  <rect x="940" y="176" width="70" height="70" rx="8" fill="#F6F1E7" stroke="#22262B" stroke-opacity="0.25"/>
  <text x="975" y="262" font-size="10" text-anchor="middle" fill="#22262B" opacity="0.6">#F6F1E7</text>
  <rect x="1022" y="176" width="70" height="70" rx="8" fill="#22262B"/>
  <text x="1057" y="262" font-size="10" text-anchor="middle" fill="#22262B" opacity="0.6">#22262B</text>
  <rect x="1104" y="176" width="70" height="70" rx="8" fill="#B5502F"/>
  <text x="1139" y="262" font-size="10" text-anchor="middle" fill="#22262B" opacity="0.6">#B5502F</text>
  <rect x="1186" y="176" width="70" height="70" rx="8" fill="#3E5C50"/>
  <text x="1221" y="262" font-size="10" text-anchor="middle" fill="#22262B" opacity="0.6">#3E5C50</text>
  <rect x="1268" y="176" width="70" height="70" rx="8" fill="#C9BFA9"/>
  <text x="1303" y="262" font-size="10" text-anchor="middle" fill="#22262B" opacity="0.6">#C9BFA9</text>
</g>

<text x="940" y="296" class="sans" font-size="13" font-weight="700" letter-spacing="2" fill="#22262B" opacity="0.6">ТИПОГРАФИКА</text>
<text x="960" y="318" class="sans" font-size="11" letter-spacing="1" fill="#22262B" opacity="0.5">DISPLAY / SERIF</text>
<text x="960" y="352" class="serif" font-size="32" fill="#22262B">Килиманджаро</text>
<text x="960" y="376" class="sans" font-size="11" letter-spacing="1" fill="#22262B" opacity="0.5">ЗАГОЛОВОК</text>
<text x="960" y="400" class="serif" font-size="22" fill="#22262B">Расположите по высоте</text>
<text x="960" y="424" class="sans" font-size="11" letter-spacing="1" fill="#22262B" opacity="0.5">ТЕКСТ</text>
<text x="960" y="446" class="sans" font-size="16" fill="#22262B">Объяснение читается спокойно, без ёрничества.</text>
<text x="960" y="470" class="sans" font-size="11" letter-spacing="1" fill="#22262B" opacity="0.5">МЕТКА</text>
<text x="960" y="488" class="sans" font-size="12" font-weight="700" letter-spacing="2" fill="#22262B">НАПРАВЛЕНИЕ СОРТИРОВКИ</text>

<text x="940" y="518" class="sans" font-size="13" font-weight="700" letter-spacing="2" fill="#22262B" opacity="0.6">ФОРМЫ</text>
<text x="960" y="540" class="sans" font-size="11" fill="#22262B" opacity="0.5">Кнопка — прямоугольник rx8, без pill</text>
<rect x="960" y="550" width="200" height="48" rx="8" fill="#22262B"/>
<text x="1060" y="580" class="sans" font-size="15" font-weight="600" text-anchor="middle" fill="#F6F1E7">Проверить</text>
<text x="960" y="626" class="sans" font-size="11" fill="#22262B" opacity="0.5">Строка списка — без рамки, только линия</text>
<text x="962" y="650" class="serif" font-size="16" text-anchor="start" fill="#22262B" opacity="0.4">1</text>
<text x="984" y="650" class="serif" font-size="18" fill="#22262B">Эльбрус</text>
<text x="1150" y="650" class="sans" font-size="11" letter-spacing="1" fill="#22262B" opacity="0.5">КАВКАЗ, РОССИЯ</text>
<line x1="960" y1="662" x2="1380" y2="662" stroke="#22262B" stroke-opacity="0.14"/>

<!-- Dark theme fragment -->
<text x="940" y="700" class="sans" font-size="13" font-weight="700" letter-spacing="2" fill="#22262B" opacity="0.6">ТЁМНАЯ ТЕМА (фрагмент Home)</text>
<rect x="940" y="712" width="460" height="282" rx="16" fill="#1B1A17"/>
<text x="964" y="746" class="serif" font-size="14" letter-spacing="3" fill="#EDE6D8">ПО ПОРЯДКУ</text>
<line x1="964" y1="756" x2="1356" y2="756" stroke="#EDE6D8" stroke-opacity="0.2"/>
<text x="964" y="780" class="sans" font-size="12" fill="#EDE6D8" opacity="0.7">Суббота, 29 августа 2026</text>
<text x="964" y="828" class="serif" fill="#EDE6D8"><tspan font-size="20">День </tspan><tspan font-size="38" font-weight="700">1</tspan></text>
<line x1="964" y1="840" x2="1050" y2="840" stroke="#D98A63" stroke-width="2"/>
<text x="964" y="870" class="sans" font-size="10" font-weight="700" letter-spacing="1.5" fill="#EDE6D8" opacity="0.55">СЕРИЯ</text>
<text x="964" y="892" class="sans" font-size="16" font-weight="600" fill="#EDE6D8">6 дней</text>
<line x1="964" y1="902" x2="1356" y2="902" stroke="#EDE6D8" stroke-opacity="0.15"/>
<rect x="964" y="944" width="412" height="40" rx="8" fill="#D98A63"/>
<text x="1170" y="969" class="sans" font-size="15" font-weight="600" text-anchor="middle" fill="#1B1A17">Играть</text>

<!-- Footer caption -->
<text x="60" y="1032" class="sans" font-size="13" font-weight="700" letter-spacing="2" fill="#22262B" opacity="0.55">ИДЕЯ КОНЦЕПЦИИ</text>
<text x="60" y="1058" class="sans" font-size="16" fill="#22262B">Редакционный альманах — головоломка подана как разворот воскресного журнала: тонкие линии вместо рамок,</text>
<text x="60" y="1084" class="sans" font-size="16" fill="#22262B">спокойная связка serif/sans и много воздуха. Факты выглядят как редакционный материал, а не игровой экран.</text>
