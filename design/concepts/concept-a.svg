  <!-- Card 1: Килиманджаро -->
  <text x="527" y="426" class="serif" font-size="18" text-anchor="middle" fill="#22262B" opacity="0.4">1</text>
  <text x="550" y="402" class="serif" font-size="20" fill="#22262B">Килиманджаро</text>
  <text x="550" y="426" class="sans" font-size="12" letter-spacing="1" fill="#22262B" opacity="0.55">ТАНЗАНИЯ</text>
  <rect x="764" y="362" width="48" height="48" rx="6" fill="#22262B" fill-opacity="0" stroke="#22262B" stroke-opacity="0.18"/>
  <use href="#a-icon-chev-up" x="776" y="374" opacity="0.3"/>
  <rect x="764" y="422" width="48" height="48" rx="6" fill="#22262B" fill-opacity="0.06" stroke="#22262B" stroke-opacity="0.3"/>
  <use href="#a-icon-chev-down" x="776" y="434" opacity="0.85"/>
  <use href="#a-icon-grip" x="838" y="416"/>
  <line x1="514" y1="476" x2="856" y2="476" stroke="#22262B" stroke-opacity="0.14" stroke-width="1"/>

