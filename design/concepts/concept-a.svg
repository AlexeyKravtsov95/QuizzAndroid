    <tspan x="514" y="266">от самой низкой к</tspan>
    <tspan x="514" y="296">самой высокой</tspan>
  </text>

  <text x="514" y="326" class="sans" font-style="italic" font-size="14" fill="#22262B" opacity="0.7">Сверху — самая низкая</text>

  <!-- card list, editorial rows -->
