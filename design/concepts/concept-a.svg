    <rect x="8" y="6.5" width="8" height="3.6" rx="1" fill="none" stroke="#22262B" stroke-width="1.6"/>
  </g>
  <g id="a-icon-back"><path d="M15 5 L9 12 L15 19" fill="none" stroke="#22262B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g id="a-icon-chev-up"><path d="M6 15 L12 9 L18 15" fill="none" stroke="#22262B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g id="a-icon-chev-down"><path d="M6 9 L12 15 L18 9" fill="none" stroke="#22262B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g id="a-icon-grip">
    <circle cx="-3" cy="-8" r="1.6" fill="#22262B"/><circle cx="3" cy="-8" r="1.6" fill="#22262B"/>
    <circle cx="-3" cy="0" r="1.6" fill="#22262B"/><circle cx="3" cy="0" r="1.6" fill="#22262B"/>
    <circle cx="-3" cy="8" r="1.6" fill="#22262B"/><circle cx="3" cy="8" r="1.6" fill="#22262B"/>
  </g>
  <g id="a-icon-mountain"><path d="M2 17 L8 7 L11.5 12.5 L15 8 L20 17 Z" fill="#B5502F"/></g>
