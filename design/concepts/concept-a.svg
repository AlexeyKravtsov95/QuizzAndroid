  <text x="550" y="674" class="serif" font-size="20" fill="#22262B">Эльбрус</text>
  <text x="550" y="698" class="sans" font-size="12" letter-spacing="1" fill="#22262B" opacity="0.55">КАВКАЗ, РОССИЯ</text>
