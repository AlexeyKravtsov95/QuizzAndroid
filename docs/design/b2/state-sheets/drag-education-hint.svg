<text x="40" y="60.34" font-family="Golos Text SemiBold, Golos Text" font-size="18" font-weight="600" fill="#23241F" letter-spacing="0.17" data-text="DragEducationHint — одноразовая подсказка на первой головоломке">DragEducationHint — одноразовая подсказка на первой головоломке</text>
<text x="40" y="85.87" font-family="Golos Text SemiBold, Golos Text" font-size="12" font-weight="600" fill="#5B584C" letter-spacing="0.18" data-text="в потоке контента · 100% и 200% · светлая и тёмная тема">в потоке контента · 100% и 200% · светлая и тёмная тема</text>
<text x="40" y="120.18" font-family="Golos Text Regular, Golos Text" font-size="12" font-weight="400" fill="#5B584C" letter-spacing="0.4" data-text="Плашка занимает собственную полосу между подписью направления и первой карточкой: она раздвигает соседние элементы, а не накладывается на них, и не перекрывает ни">Плашка занимает собственную полосу между подписью направления и первой карточкой: она раздвигает соседние элементы, а не накладывается на них, и не перекрывает ни</text>
<text x="40" y="136.18" font-family="Golos Text Regular, Golos Text" font-size="12" font-weight="400" fill="#5B584C" letter-spacing="0.4" data-text="DragHandle, ни MoveButton. Заливка сплошная (surfaceContainer), не полупрозрачная — контраст текста не зависит от того, что под плашкой.">DragHandle, ни MoveButton. Заливка сплошная (surfaceContainer), не полупрозрачная — контраст текста не зависит от того, что под плашкой.</text>
<text x="40" y="160.18" font-family="Golos Text Regular, Golos Text" font-size="12" font-weight="400" fill="#5B584C" letter-spacing="0.4" data-text="Точный текст плашки — «Перетащите за ручку или используйте стрелки», без вариаций. TalkBack при этом озвучивает другую формулировку: «Для изменения порядка используйте">Точный текст плашки — «Перетащите за ручку или используйте стрелки», без вариаций. TalkBack при этом озвучивает другую формулировку: «Для изменения порядка используйте</text>
<text x="40" y="176.18" font-family="Golos Text Regular, Golos Text" font-size="12" font-weight="400" fill="#5B584C" letter-spacing="0.4" data-text="действия карточки или кнопки перемещения».">действия карточки или кнопки перемещения».</text>
<text x="40" y="200.18" font-family="Golos Text Regular, Golos Text" font-size="12" font-weight="400" fill="#5B584C" letter-spacing="0.4" data-text="PrimaryButton «Проверить» — disabled первые dragHint.submitLockDuration (600 мс): прозрачный фон, обводка outline при opacity.disabledContent 38%, текст onSurface при той же">PrimaryButton «Проверить» — disabled первые dragHint.submitLockDuration (600 мс): прозрачный фон, обводка outline при opacity.disabledContent 38%, текст onSurface при той же</text>
<text x="40" y="216.18" font-family="Golos Text Regular, Golos Text" font-size="12" font-weight="400" fill="#5B584C" letter-spacing="0.4" data-text="непрозрачности. Покачивание карточки — один раз за dragHint.wobbleDuration (300 мс) с амплитудой 4°; при reduced motion оно обнуляется полностью, а dragHint.autoHideDelay (4">непрозрачности. Покачивание карточки — один раз за dragHint.wobbleDuration (300 мс) с амплитудой 4°; при reduced motion оно обнуляется полностью, а dragHint.autoHideDelay (4</text>
<text x="40" y="232.18" font-family="Golos Text Regular, Golos Text" font-size="12" font-weight="400" fill="#5B584C" letter-spacing="0.4" data-text="с) и submitLockDuration не сокращаются.">с) и submitLockDuration не сокращаются.</text>
