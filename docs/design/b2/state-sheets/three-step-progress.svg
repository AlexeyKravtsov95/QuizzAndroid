<text x="40" y="120.18" font-family="Golos Text Regular, Golos Text" font-size="12" font-weight="400" fill="#5B584C" letter-spacing="0.4" data-text="Модель — два независимых поля. mode = ActiveDay живёт только на Home.InProgress и допускает completedCount 0–2, где точка сразу после последней пройденной">Модель — два независимых поля. mode = ActiveDay живёт только на Home.InProgress и допускает completedCount 0–2, где точка сразу после последней пройденной</text>
<text x="40" y="136.18" font-family="Golos Text Regular, Golos Text" font-size="12" font-weight="400" fill="#5B584C" letter-spacing="0.4" data-text="находится в состоянии current. mode = ClosedDay живёт только в Archive row, допускает 0–3 и состояния current не имеет ни при каком значении. Одно и то же">находится в состоянии current. mode = ClosedDay живёт только в Archive row, допускает 0–3 и состояния current не имеет ни при каком значении. Одно и то же</text>
<text x="40" y="152.18" font-family="Golos Text Regular, Golos Text" font-size="12" font-weight="400" fill="#5B584C" letter-spacing="0.4" data-text="completedCount = 2 рендерится по-разному в двух режимах — сравнение вынесено отдельной секцией ниже.">completedCount = 2 рендерится по-разному в двух режимах — сравнение вынесено отдельной секцией ниже.</text>
<text x="40" y="176.18" font-family="Golos Text Regular, Golos Text" font-size="12" font-weight="400" fill="#5B584C" letter-spacing="0.4" data-text="Точки никогда не единственный носитель состояния: рядом всегда стоит текст, и именно он озвучивается TalkBack (точки — clearAndSetSemantics).">Точки никогда не единственный носитель состояния: рядом всегда стоит текст, и именно он озвучивается TalkBack (точки — clearAndSetSemantics).</text>
