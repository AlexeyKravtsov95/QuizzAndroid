name: CI

# ARCHITECTURE.md, раздел 9 («CI»): `./gradlew lint test` на каждый push — здесь дополнены
# assembleDebug (сборка) и assembleDebugAndroidTest (компиляция инструментальных тестов).
# Сами инструментальные тесты на эмуляторе в CI не запускаются — ARCHITECTURE.md прямо
# отводит им ручной прогон перед релизом («эмулятор в CI для соло-проекта — необязательная
# роскошь»), поэтому connectedDebugAndroidTest здесь нет.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      # ITERATION_2_DESIGN.md, D-2: Robolectric резолвит android-all instrumented jars
      # (~190 МБ) собственным резолвером, мимо кэша ~/.gradle из setup-gradle — кэшируется
      # отдельно. Ключ учитывает ОС и версию Robolectric из каталога версий.
      - name: Cache Robolectric android-all jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ runner.os }}-robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-robolectric-

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Compile instrumented tests
        run: ./gradlew assembleDebugAndroidTest

      - name: Lint
        run: ./gradlew lint

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore
