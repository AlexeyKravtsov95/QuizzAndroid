name: CI

# ARCHITECTURE.md, раздел 9 («CI»): `./gradlew lint test` на каждый push — здесь дополнены
# assembleDebug (сборка) и assembleDebugAndroidTest (компиляция инструментальных тестов).
# Сами инструментальные тесты на эмуляторе в CI не запускаются — ARCHITECTURE.md прямо
# отводит им ручной прогон перед релизом («эмулятор в CI для соло-проекта — необязательная
# роскошь»), поэтому connectedDebugAndroidTest здесь нет.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      # ITERATION_2_DESIGN.md, D-2: Robolectric резолвит android-all instrumented jars
      # (~190 МБ) собственным резолвером, мимо кэша ~/.gradle из setup-gradle — кэшируется
      # отдельно. Ключ учитывает ОС и версию Robolectric из каталога версий.
      - name: Cache Robolectric android-all jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ runner.os }}-robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-robolectric-

      # ITERATION_4_DESIGN.md, PR 4A (I4-D8): валидатор контента — автономный
      # инструмент на Python, а не Gradle-задача. Он не тянет AGP, не влияет на
      # время Android-шагов и запускается до них: сломанный инструмент должен быть
      # виден раньше, чем сборка APK.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/validate-content/requirements.txt

      # --require-hashes: lock-файл фиксирует точные версии и sha256 всех
      # дистрибутивов, поэтому подмена пакета на PyPI приведёт к падению установки,
      # а не к тихому запуску другой версии.
      - name: Install content validator
        run: pip install --require-hashes -r tools/validate-content/requirements.txt

      # Self-check валидатора на синтетических фикстурах: 21 правило, буквенные
      # подкоды и M01-M10.
      - name: Validator self-check
        run: python3 -m pytest tools/validate-content/tests -q

      # ITERATION_4_DESIGN.md, §12.4: CI проверяет настоящий пакет целиком и БЕЗ
      # --expect-*. Накопительный объём батча (7/21 в 4C-1) живёт в описании PR и в
      # чек-листе, а не в конфигурации, которую пришлось бы править пять раз;
      # постоянное ожидание 35/105 добавляется сюда в PR 4D.
      - name: Validate content pack
        run: python3 tools/validate-content/validate.py app/src/main/assets/content

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Compile instrumented tests
        run: ./gradlew assembleDebugAndroidTest

      - name: Lint
        run: ./gradlew lint

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      # ITERATION_2_DESIGN.md, PR 2B: P17 (SystemClockProviderTest) живёт в src/testRelease
      # и без этого шага не запускался бы вообще.
      - name: Release unit tests
        run: ./gradlew testReleaseUnitTest

      # ITERATION_2_DESIGN.md, PR 2C, раздел 10: релизный APK не должен содержать
      # debug-код (DebugActivity, второй launcher) — assembleRelease ловит регрессию,
      # если debug-исходники утекут в main/release.
      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore
